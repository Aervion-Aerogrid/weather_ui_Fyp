<!-- Container for heading and text -->
<app-drawerpage></app-drawerpage>
<div class="container my-4 text-center">
  <h1>Geo-Visual Analytics</h1>

  <div class="d-flex justify-content-center align-items-center flex-wrap gap-4 mt-3">
    <div class="d-flex align-items-center">
      <span class="live-dot" [ngStyle]="{'background-color': isApiUp ? 'green' : 'red'}"></span>
      <span class="ms-2 fw-bold" [ngClass]="{'text-success': isApiUp, 'text-danger': !isApiUp}">Heatmaps</span>
    </div>

    <div class="d-flex align-items-center">
      <span class="live-dot" [ngStyle]="{'background-color': isApiUp ? 'green' : 'red'}"></span>
      <span class="ms-2 fw-bold" [ngClass]="{'text-success': isApiUp, 'text-danger': !isApiUp}">Isolines</span>
    </div>

    <div class="d-flex align-items-center">
      <span class="live-dot" [ngStyle]="{'background-color': isApiUp ? 'green' : 'red'}"></span>
      <span class="ms-2 fw-bold" [ngClass]="{'text-success': isApiUp, 'text-danger': !isApiUp}">Stations</span>
    </div>

    <div class="d-flex align-items-center">
      <span class="live-dot" [ngStyle]="{'background-color': isApiUp ? 'green' : 'red'}"></span>
      <span class="ms-2 fw-bold" [ngClass]="{'text-success': isApiUp, 'text-danger': !isApiUp}"> Reports</span>
    </div>
    <div class="d-flex align-items-center">
      <span class="live-dot" [ngStyle]="{'background-color': isApiUp ? 'green' : 'red'}"></span>
      <span class="ms-2 fw-bold" [ngClass]="{'text-success': isApiUp, 'text-danger': !isApiUp}"> Edit Layer</span>
    </div>
    <p class="ms-3 mb-0" [ngClass]="{'text-muted': isApiUp, 'text-danger': !isApiUp}">{{ apiStatus }}</p>
  </div>
  <p>Updating Every 2:30 hours</p>
</div>




<div class="container my-2">
    <!-- Progress bar displayed between dropdowns -->
    <div class="progress-bar-container" *ngIf="loading">
      <mat-progress-bar mode="indeterminate" color="primary"></mat-progress-bar>
    </div>
  <!-- Dropdown for selecting image type -->
  <mat-form-field appearance="fill">
    <mat-label>Select Image Type:</mat-label>
    <mat-select [(ngModel)]="selectedImageType" (selectionChange)="loadIsobarData()">
      <mat-option value="isobar">Isobar</mat-option>
      <mat-option value="isotherm">Isotherm</mat-option>
      <mat-option value="isoneph">Isoneph</mat-option>
      <mat-option value="isogon">Isogon</mat-option>
      <mat-option value="isohume">Isohume</mat-option>
      <mat-option value="isotach">Isotach</mat-option>
      <mat-option value="isohyet">Isohyet</mat-option>
      <mat-option value="isodrosotherm">Isodrosotherm</mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Dropdown for selecting data type -->
  <mat-form-field appearance="fill" class="mt-2">
    <mat-label>Select Data Type:</mat-label>
    <mat-select [(ngModel)]="selectedDataType" (selectionChange)="weatherdataformat()">
      <mat-option value="synop">Synoptic</mat-option>
      <mat-option value="metar">Metar</mat-option>
      <mat-option value="wis2">Wis 2</mat-option>
    </mat-select>
  </mat-form-field>

  <div class="mt-3 text-center">
    <label class="d-block mb-2">Adjust Max Station Cluster Radius: {{ maxClusterRadius }}</label>

    <div class="d-flex justify-content-center align-items-center gap-4">
      <!-- Option 1: 0 -->
      <label class="d-flex align-items-center">
        <input type="radio" name="clusterRadius" [(ngModel)]="maxClusterRadius" [value]="0" (change)="setClusterRadius(0)">
        <span class="ms-1">0</span>
      </label>

      <!-- Option 2: 200 -->
      <label class="d-flex align-items-center">
        <input type="radio" name="clusterRadius" [(ngModel)]="maxClusterRadius" [value]="200" (change)="setClusterRadius(200)">
        <span class="ms-1">200</span>
      </label>

      <!-- Option 3: Custom -->
      <label class="d-flex align-items-center">
        <input type="radio" name="clusterRadius" [checked]="isCustomSelected" (change)="selectCustom()">
        <span class="ms-1">Custom</span>
      </label>
    </div>

    <!-- Show slider only when Custom is selected -->
    <div *ngIf="isCustomSelected" class="d-flex justify-content-center mt-2">
      <input
        id="clusterRadiusSlider"
        title="Cluster Radius"
        type="range"
        class="form-range"
        min="1"
        max="200"
        step="1"
        [(ngModel)]="customRadius"
        (input)="updateClusterRadius(customRadius)">
    </div>
  </div>






</div>



<!-- Button row with equal-sized buttons -->
<div class="button-row d-flex flex-wrap justify-content-between">
  <button mat-raised-button class="btn btn-primary m-1" (click)="toggleStationMarkers()">
    {{ stationMarkersVisible ? 'Hide Stations' : 'Show Stations' }}
  </button>
  <button mat-raised-button class="btn btn-primary m-1" (click)="togglePngOverlay()">
    {{ pngOverlayVisible ? 'Hide Lines' : 'Show Lines' }}
  </button>
  <button mat-raised-button class="btn btn-primary m-1" (click)="toggleHeatmapOverlay()">
    {{ heatmapOverlay ? 'Hide HeatMap' : 'Show HeatMap' }}
  </button>
  <button mat-raised-button class="m-1" (click)="toggleGeoJsonLayer()">
    {{ geoJsonLayerVisible ? 'Hide Map' : 'Show Map' }}
  </button>
  <button mat-raised-button class="btn btn-success m-1" [routerLink]="['/svg-edit']" [queryParams]="{ type: selectedImageType }">
    Edit Layer
  </button>


</div>


<div id="capture-area">
  <div class="container-isotherm">
    <div id="map2"></div>
  </div>
  <app-image-download [imageType]="selectedImageType"></app-image-download>
</div>
