<div class="container-fluid">
  <div class="row">
    <!-- Fixed Report Download Section (25% width) -->
    <div class="col-md-3 report-section">
      <p>DOWNLOAD REPORTS</p>
      <app-report-download></app-report-download>
    </div>

    <!-- Image Download Row (75% width) -->
    <div class="col-md-9 image-download">
      <p>Download Selected Image Type: Layer / Heatmap</p>
      <div *ngIf="images.length > 0" class="download-container d-flex flex-wrap">
        <div *ngFor="let image of images" class="card-container p-2">
          <!-- Card Layout for Image Preview -->
          <div class="card" style="width: 18rem;">
            <img [src]="image.url" class="card-img-top" alt="Image preview" (click)="openImageInPopup(image)" />
            <div class="card-body">
              <h5 class="card-title">{{ image.name }}</h5>
              <!-- Button to open image in a popup and allow download -->

            </div>
          </div>
        </div>
      </div>

      <!-- Show loading spinner if images are being fetched -->
      <div *ngIf="loading" class="loading-spinner text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="sr-only">Loading...</span>
        </div>
      </div>
    </div>
  </div>
</div>
