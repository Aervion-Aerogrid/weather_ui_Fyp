<app-header-page></app-header-page>
<app-drawer-icon></app-drawer-icon>

<!-- Background Video -->
<div class="video-container">
  <video autoplay loop muted playsinline class="background-video">
    <source src="../../../../assets/icons/clouds_2.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
</div>

<main class="content fade-in">
  <div class="container d-flex justify-content-center align-items-center">
    <div class="col-md-8">
      <div class="text-center mb-4">
        <h1 class="display-4">Settings Page</h1>
        <img src="../../../../assets/icons/pmd-removebg-preview.png" alt="Logo" class="logo">
      </div>

      <div class="row">
        <!-- About Us -->
        <div class="col-md-4">
          <mat-card class="mb-3 settings-card">
            <mat-card-title>
              <mat-icon>info</mat-icon> About Us
            </mat-card-title>
            <mat-card-content>
              <p>We provide accurate and reliable meteorological data to keep you informed.</p>
            </mat-card-content>
          </mat-card>
        </div>

        <!-- PMD Locations -->
        <div class="col-md-4">
          <mat-card class="mb-3 settings-card" (click)="isExpanded = !isExpanded">
            <mat-card-title>
              <mat-icon>public</mat-icon> PMD Locations Google Map
              <mat-icon>location_on</mat-icon>
              <mat-icon>{{ isExpanded ? 'expand_less' : 'expand_more' }}</mat-icon>
            </mat-card-title>
          </mat-card>
        </div>

        <!-- Social Media -->
        <div class="col-md-4">
          <mat-card class="mb-3 settings-card">
            <mat-card-title>
              <mat-icon>share</mat-icon> Follow Us
            </mat-card-title>
            <mat-card-content>
              <p>Stay updated by following us on social media.</p>
            </mat-card-content>
          </mat-card>
        </div>
      </div>

      <!-- Locations Section -->
      <div class="fade-in" *ngIf="isExpanded">
        <!-- Search Bar -->
        <div class="search-container mb-3">
          <mat-form-field appearance="outline">
            <mat-label>Search Location</mat-label>
            <input matInput (input)="filterLocations($event)" placeholder="Enter location name">
          </mat-form-field>
        </div>

        <!-- Locations Grid -->
        <div class="row fade-in">
          <div class="col-md-4" *ngFor="let location of displayedLocations">
            <mat-card class="location-card">
              <img [src]="location.image" alt="{{ location.name }}" class="location-image">
              <mat-card-title>{{ location.name }}</mat-card-title>
              <mat-card-actions class="button-container">
                <a [href]="location.link" target="_blank" rel="noopener">
                  <button mat-button class="animated-button">View Location</button>
                </a>
              </mat-card-actions>
            </mat-card>
          </div>
        </div>

        <!-- Load More Button
        <div class="load-more-container text-center" *ngIf="filteredLocations.length > displayedLocations.length">
          <button mat-button class="load-more-button" (click)="loadMore()">Show More</button>
        </div>
      -->
      </div>
    </div>
  </div>
</main>
