<main class="content">
  <video autoplay loop muted class="background-video">
    <source src="../../../assets/icons/clouds.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>
  <div class="login-container">
    <img
      src="../../../assets/icons/aervion-removebg-preview.png"
      alt="Login Image"
      class="login-image rotating-rtl"
    />

    <div class="keyboard">
      <h1>
        <span class="key">A</span>
        <span class="key">D</span>
        <span class="key">M</span>
        <span class="key">I</span>
        <span class="key">N</span>
        <span class="key">&nbsp;</span> <!-- Add space between words -->
        <span class="key">L</span>
        <span class="key">O</span>
        <span class="key">G</span>
        <span class="key">I</span>
        <span class="key">N</span>
      </h1>
    </div>


    <form (ngSubmit)="login()" #loginForm="ngForm" novalidate>
      <div class="form-group">
        <label for="username">Username*</label>
        <input
          type="text"
          id="username"
          class="form-control"
          [(ngModel)]="username"
          name="username"
          #usernameField="ngModel"
          required
          minlength="6"
          placeholder="Enter Username"
          (input)="validateUsername()"
        />
        <div
          *ngIf="usernameField.invalid && usernameField.touched"
          class="text-danger"
        >
          <small *ngIf="usernameField.errors?.['required']">Username is required.</small>
          <small *ngIf="usernameField.errors?.['minlength']"></small>
          <small *ngIf="usernameField.errors?.['pattern']"></small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password*</label>
        <div class="input-group">
          <!-- Password Input Field -->
          <input
            type="{{ passwordVisible ? 'text' : 'password' }}"
            id="password"
            class="form-control"
            [(ngModel)]="password"
            name="password"
            #passwordField="ngModel"
            required
            minlength="6"
            placeholder="Enter Password"
            (input)="validatePassword()"
          />
          <div class="input-group-append">
            <!-- Eye Icon Button -->
            <button
              type="button"
              class="btn btn-outline-secondary"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="passwordVisible ? 'Hide password' : 'Show password'"
              title="{{ passwordVisible ? 'Hide password' : 'Show password' }}"
            >
              <i class="fa" [ngClass]="passwordVisible ? 'fa-eye-slash' : 'fa-eye'"></i>
            </button>
          </div>
        </div>

        <div *ngIf="passwordField.invalid && passwordField.touched" class="text-danger">
          <small *ngIf="passwordField.errors?.['required']">Password is required.</small>
          <small *ngIf="passwordField.errors?.['minlength']">Password must be at least 6 characters long.</small>
          <small *ngIf="passwordField.errors?.['pattern']">Password does not meet the required pattern.</small>
        </div>
      </div>



      <div class="loading-spinner" *ngIf="isLoading"></div>
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loginForm.invalid"
        style="margin-top: 25px"
      >
        <span class="button-text">Login</span>
        <span class="hover-text">Enter</span>
      </button>

      <div *ngIf="loginError" class="alert alert-danger mt-3">
        {{ loginError }}
      </div>

<!-- Link to Sign Up page, triggers PIN modal on click -->
<div class="text-center mt-3">
  <small>
    Don't have an account?
    <a
      href="javascript:void(0)"
      (click)="onSignUpClick()"
      class="signup-link"
    >Sign Up</a>
  </small>
</div>


      <!-- Conditionally show the PIN modal -->

    </form>

    <app-secretpin
    *ngIf="showPinModal"
    (pinVerified)="onPinVerified($event)"
  ></app-secretpin>
  </div>
  <app-header></app-header>
</main>
