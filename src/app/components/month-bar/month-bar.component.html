<div class="container">
  <!-- First Row: Year & City Selection -->
  <div class="row justify-content-center mb-3">
    <div class="col-md-auto">
      <mat-form-field appearance="outline">
        <mat-label>Select Year</mat-label>
        <mat-select [value]="selectedYear" (selectionChange)="onYearChange($event)">
          <mat-option *ngFor="let year of availableYears" [value]="year">
            {{ year }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="col-md-auto">
      <mat-form-field appearance="outline">
        <mat-label>Select City</mat-label>
        <mat-select [value]="selectedCity" (selectionChange)="onCityChange($event)">
          <mat-option *ngFor="let city of availableCities" [value]="city">
            {{ city }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <!-- Second Row: Parameter Selection (Centered) -->
  <div class="row justify-content-center">
    <div class="col-md-auto">
      <mat-form-field appearance="outline" style="width: 300px;">
        <mat-label>Select Parameter</mat-label>
        <mat-select [value]="selectedParameter" (selectionChange)="onParameterChange($event)">
          <mat-option *ngFor="let parameter of availableParameters" [value]="parameter">
            {{ parameter }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>
</div>


<!-- Chart Container -->
<div *ngIf="chartOptions?.data">
  <canvasjs-chart
    [options]="chartOptions"
    [styles]="{ width: '100%', height: '460px' }"
  ></canvasjs-chart>
</div>

<!-- Error Message for No Data -->
<div *ngIf="!chartOptions?.data?.length" class="alert alert-warning text-center mt-3">
  No data available for the selected filters.
</div>
