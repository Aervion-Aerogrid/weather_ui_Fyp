<div class="d-flex justify-content-center align-items-center mb-3">
  <!-- City Selection -->
  <mat-form-field appearance="outline" class="custom-dropdown">
    <mat-label>Select City</mat-label>
    <mat-select [(value)]="selectedCity" (selectionChange)="onCityChange($event)">
      <mat-option *ngFor="let city of availableCities" [value]="city">
        {{ city }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Parameter Selection -->
  <mat-form-field appearance="outline" class="custom-dropdown">
    <mat-label>Select Parameter</mat-label>
    <mat-select [(value)]="selectedParameter" (selectionChange)="onParameterChange($event)">
      <mat-option *ngFor="let parameter of availableParameters" [value]="parameter">
        {{ parameter }}
      </mat-option>
    </mat-select>
  </mat-form-field>


</div>
<!-- Year Range Selection -->
<div class="d-flex justify-content-center align-items-center mb-3 flex-wrap">
  <mat-form-field appearance="outline" class="year-range-field">
    <mat-label>Start Year</mat-label>
    <input matInput type="number" [(ngModel)]="startYear" min="1950" max="2050" (change)="fetchClimateData()">
  </mat-form-field>

  <span class="mx-3">to</span>

  <mat-form-field appearance="outline" class="year-range-field">
    <mat-label>End Year</mat-label>
    <input matInput type="number" [(ngModel)]="endYear" min="1950" max="2050" (change)="fetchClimateData()">
  </mat-form-field>
</div>

<!-- Chart Container -->
<div *ngIf="chartOptions?.data">
  <canvasjs-chart
    [options]="chartOptions"
    [styles]="{ width: '100%', height: '460px' }"
  ></canvasjs-chart>
</div>

<!-- Error Message for No Data -->
<div *ngIf="!chartOptions?.data?.length" class="alert alert-warning text-center mt-3">
  No data available for the selected filters.
</div>
