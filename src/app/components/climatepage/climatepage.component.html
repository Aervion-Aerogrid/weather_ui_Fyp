<div *ngIf="refreshTrigger">
  <app-headerpage></app-headerpage>

  <div class="row mx-3 my-3">
    <div class="col d-flex align-items-center justify-content-start p-3">
      <button title="drawer" type="button" class="btn btn-light drawer-button" (click)="toggleDrawer()">
        <img src="../../../assets/icons/menu_icon2.png" alt="Menu Icon" class="menu-icon">
      </button>
      <h1 class="ml-2">Menu</h1>
    </div>
  </div>

  <app-drawerpage></app-drawerpage>

  <!-- Main Layout -->
  <main class="content p-9">
    <div class="container px-30">
      <h2>Climate Analytical Data Visualization</h2>
      <p class="text-muted">100 Years of Data at Your Fingertips</p>
      <div class="container my-4 text-center">
        <div class="d-flex justify-content-center align-items-center flex-wrap gap-4 mt-3">
          <div class="d-flex align-items-center">
            <span class="live-dot" [ngStyle]="{'background-color': isApiUp ? 'green' : 'red'}"></span>
            <span class="ms-2 fw-bold" [ngClass]="{'text-success': isApiUp, 'text-danger': !isApiUp}">Yearly Data</span>
          </div>

          <div class="d-flex align-items-center">
            <span class="live-dot" [ngStyle]="{'background-color': isApiUp ? 'green' : 'red'}"></span>
            <span class="ms-2 fw-bold" [ngClass]="{'text-success': isApiUp, 'text-danger': !isApiUp}">Monthly Data</span>
          </div>

          <div class="d-flex align-items-center">
            <span class="live-dot" [ngStyle]="{'background-color': isApiUp ? 'green' : 'red'}"></span>
            <span class="ms-2 fw-bold" [ngClass]="{'text-success': isApiUp, 'text-danger': !isApiUp}">Daily Data</span>
          </div>

          <div class="d-flex align-items-center">
            <span class="live-dot" [ngStyle]="{'background-color': isApiUp ? 'green' : 'red'}"></span>
            <span class="ms-2 fw-bold" [ngClass]="{'text-success': isApiUp, 'text-danger': !isApiUp}">Reports</span>
          </div>

          <p class="ms-3 mb-0" [ngClass]="{'text-muted': isApiUp, 'text-danger': !isApiUp}">{{ apiStatus }}</p>
        </div>
      </div>
      <mat-divider class="my-4"></mat-divider>

      <div class="row">
        <!-- Graphs Section (75%) -->
        <div class="col-lg-8">
          <mat-card class="p-4">
            <h1 class="text-dark fw-bold text-center">Yearly Climate Data</h1>
            <div class="chart-container my-4">
              <app-bar-graph></app-bar-graph>
            </div>
          </mat-card>

          <mat-divider class="my-4"></mat-divider>

          <mat-card class="p-4">
            <h1 class="text-dark fw-bold text-center">Monthly Climate Data</h1>
            <div class="chart-container my-4">
              <app-month-bar></app-month-bar>
            </div>
          </mat-card>
        </div>

        <!-- Report Download Section (25%) -->
        <div class="col-lg-4">
          <mat-card class="p-4 text-center">
            <h1 class="text-dark fw-bold">Download Reports</h1>
            <p class="text-muted">Download the reports for the selected city and parameter.</p>

            <div class="my-4">
              <app-climate-report></app-climate-report>
            </div>
          </mat-card>
        </div>
      </div>
    </div>
  </main>
</div>
