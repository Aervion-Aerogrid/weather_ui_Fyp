<div class="report-section">
  <div class="download-card" (click)="downloadDaily()">
    <span class="report-number">1 </span>
    <i class="fas fa-file-csv"></i>
    <p> Download Daily Day Climate Report</p>
  </div>

  <div class="download-card" (click)="downloadMonthly()">
    <span class="report-number">2 </span>
    <i class="fas fa-file-csv"></i>
    <p>Download Monthly Climate Report</p>
  </div>

  <div class="download-card" (click)="downloadYearly()">
    <span class="report-number">3</span>
    <i class="fas fa-file-csv"></i>
    <p>Download Yearly Climate Report</p>
  </div>
</div>
