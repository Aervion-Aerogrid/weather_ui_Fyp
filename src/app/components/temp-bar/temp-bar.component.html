<!-- Simple Toggle Button -->
<div class="row align-items-center mb-3">
  <div class="col-auto">
    <button (click)="toggleData()" class="toggle-btn btn">
      <span [ngClass]="isMonthly ? 'monthly' : 'yearly'">
        {{ isMonthly ? 'Show Yearly Data' : 'Show Monthly Data' }}
      </span>
    </button>
  </div>

  <!-- Year selection dropdown (Only visible in Monthly mode) -->
  <div class="col-auto" *ngIf="isMonthly">
    <label for="yearSelect" class="form-label">Select Year:</label>
    <select id="yearSelect" class="form-select" (change)="onYearChange($event)">
      <option *ngFor="let year of availableYears" [value]="year" [selected]="year === selectedYear">
        {{ year }}
      </option>
    </select>
  </div>

  <!-- City selection dropdown -->
  <div class="col-auto">
    <label for="citySelect" class="form-label">Select City:</label>
    <select id="citySelect" class="form-select" (change)="onCityChange($event)">
      <option *ngFor="let city of availableCities" [value]="city" [selected]="city === selectedCity">
        {{ city }}
      </option>
    </select>
  </div>
</div>

<!-- Chart Container -->
<div *ngIf="chartOptions.data">
  <canvasjs-chart [options]="chartOptions" [styles]="{ width: '100%', height: '460px' }"></canvasjs-chart>
</div>
