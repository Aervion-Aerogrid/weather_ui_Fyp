<!-- FIXED HEADER COMPONENT THROUGHOUT THE APPLICATION -->
<app-header-page></app-header-page>
<app-drawer-icon></app-drawer-icon>
<main class="content">
  <!-- Container for text -->

  <div class="container my-2">
    <h2>WEATHER AI FORECASTING</h2>
    <p class="text-muted">
      Using Neural networks predicting yearly , Monthly and Daily Weather Data
    </p>
    <div class="container my-4 text-center">
      <div class="d-flex justify-content-center align-items-center flex-wrap gap-4 mt-3">
        <div class="d-flex align-items-center">
          <span class="live-dot" [ngStyle]="{'background-color': isApiUp ? 'green' : 'red'}"></span>
          <span class="ms-2 fw-bold" [ngClass]="{'text-success': isApiUp, 'text-danger': !isApiUp}">Yearly Prediction</span>
        </div>

        <div class="d-flex align-items-center">
          <span class="live-dot" [ngStyle]="{'background-color': isApiUp ? 'green' : 'red'}"></span>
          <span class="ms-2 fw-bold" [ngClass]="{'text-success': isApiUp, 'text-danger': !isApiUp}">Monthly Prediction</span>
        </div>

        <div class="d-flex align-items-center">
          <span class="live-dot" [ngStyle]="{'background-color': isApiUp ? 'green' : 'red'}"></span>
          <span class="ms-2 fw-bold" [ngClass]="{'text-success': isApiUp, 'text-danger': !isApiUp}">Daily Prediction</span>
        </div>

        <p class="ms-3 mb-0" [ngClass]="{'text-muted': isApiUp, 'text-danger': !isApiUp}">{{ apiStatus }}</p>
      </div>
    </div>
    <div class="container my-4 text-center">
      <div
        class="d-flex justify-content-center align-items-center flex-wrap gap-4 mt-3"
      ></div>
    </div>
    <mat-divider class="my-4"></mat-divider>
    <div class="row">

      <div class="col">
        <mat-card class="p-4">
          <h1 class="text-dark fw-bold text-center">Daily Climate Data</h1>
          <div class="chart-container my-4">
           <app-early-forecast></app-early-forecast>
          </div>
        </mat-card>

        <mat-divider class="my-4"></mat-divider>
        <mat-card class="p-4">
          <h1 class="text-dark fw-bold text-center">Yearly Climate Data</h1>
          <div class="chart-container my-4">
            <app-forcast></app-forcast>
          </div>
        </mat-card>

        <mat-divider class="my-4"></mat-divider>

        <mat-card class="p-4">
          <h1 class="text-dark fw-bold text-center">Monthly Climate Data</h1>
          <div class="chart-container my-4">
            <app-forcast></app-forcast>
          </div>
        </mat-card>
      </div>


    </div>
  </div>
</main>

<!-- FIXED FOOTER COMPONENT THROUGHOUT THE APPLICATION -->
<app-footerpage class="footer"></app-footerpage>
